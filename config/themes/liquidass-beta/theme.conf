THEME_NAME="LiquidAss (Beta)"

# Experimental: switches the shell stack from waybar to the Quickshell
# liquid-glass shell (quickshell -c sharkos). Any theme without this line
# gets the classic stack.
SHELL_KIND="quickshell"

# Quickshell glass tint (#AARRGGBB)
GLASS_TINT="#4d0a1418"

